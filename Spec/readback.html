  if (lcs.length) { const vs = lcs.filter(v => keep(D && D.v.has(v.name), 0));
    const S = sec("State machines", lcs.length, "", D && some(D.v.size),
      "The principal state machines of the area: the life of each kind of thing, over all of them together. Arrows carry the action that makes the change.");
    vs.forEach(v => { S.append(h("h3", "", v.name), diagram(v));
      // the same machine as a table: a crowded drawing is easier to read this way
      const m = new Map(); v.edges.forEach(([x, act, y]) => { const k = x + "\0" + y; if (!m.has(k)) m.set(k, []); if (!m.get(k).includes(act)) m.get(k).push(act); });
      const tb = h("tbody"); [...m].forEach(([k, acts]) => { const [x, y] = k.split("\0");
        tb.append(h("tr", "", h("td", "", x), h("td", "", "→ " + y), h("td", "mono", acts.join(", ")))); });
      const d = h("details", "sub", h("summary", "", "as a table (" + m.size + " transitions)"),
        h("div", "tw", h("table", "", h("thead", "", h("tr", "", ["from", "to", "by"].map(x => h("th", "", x)))), tb)));
      d.open = m.size > 10; S.append(d); });
    hid(S, lcs.length - vs.length); }
  const gq = D ? D.rq : [];
  if (a.questions.length || gq.length) {
    const S = sec("Open questions", a.questions.length, "", D && some(D.q.size + gq.length),
      "Yours to decide: something the requirements do not say, or where two sources disagree.");
    const qs = a.questions.filter(q => keep(D && D.q.has(q.text), 0));
    qs.forEach(q => S.append(questionRow(q, D && D.q.has(q.text))));
    gq.forEach(q => S.append(goneRow(q, "resolved", "q"))); hid(S, a.questions.length - qs.length); }
  const at = Object.entries(a.atomic || {});
  if (at.length) { const tb = h("tbody"); at.forEach(([k, v]) => tb.append(h("tr", "", h("td", "f act", k), h("td", "", v))));
    sec("Concurrency decisions", at.length, "", 0, "Decided, with the reason: whether an action can interleave with others inside the implementation.")
      .append(h("div", "tw", h("table", "", tb))); }
  root.append(det);
  return root;
}

// ---- page ----
// Three kinds of page come from this template: one per area (the area as it stands),
// one for a change (every area the change touches, and what it did there), and the list of areas.
const app = document.getElementById("app"), KIND = PAGE.kind || "area";
const link = (text, href, cls) => { const x = h("a", cls || "", text); x.href = href; return x; };
// an area can have parts ("protection/runs"): one page per area, one tab per part
const areaOf = name => name.split("/")[0], partOf = name => name.split("/").slice(1).join("/");
const file = (name, id) => encodeURIComponent(areaOf(name)) + ".html"
  + (partOf(name) || id ? "#" + encodeURIComponent(partOf(name)) + (id ? "@" + encodeURIComponent(id) : "") : "");
const pl = (k, one) => k + " " + one + (k === 1 ? "" : "s");
// one way in has one owner: an entry a part models or leaves out, which another part models too
// what other parts say about a way in, once per part and standing
const others = e => (e.shared || []).filter((x, i, l) => l.findIndex(y => y.part === x.part && y.status === x.status) === i);
const clash = e => /modelled|left out/.test(e.status) && (e.shared || []).some(x => x.status === "modelled" && x.same !== false);
// the ways in that several parts speak about, each with its owner and the parts that take it as given
const sharedWays = areas => {
  const rows = areas.flatMap(a => (a.surface || []).filter(e => e.status === "modelled" && (e.shared || []).length).map(e => [a, e]));
  if (!rows.length) return null;
  const two = rows.filter(([, e]) => clash(e)).length, d = h("details", "sec"); d.open = !!two;
  d.append(h("summary", "", h("h2", "", "Ways in shared between parts"), h("span", "cnt", String(rows.length)),
      two ? h("span", "badge failed", two + " with two owners") : null),
    h("p", "sub", "A way into the code that more than one part speaks about. One part owns it: its model says when the way in is accepted and what it does. The others take that as given and say what follows for their own things."));
  const tb = h("tbody"); rows.sort((x, y) => clash(y[1]) - clash(x[1])).forEach(([a, e]) =>
    tb.append(h("tr", clash(e) ? "lo" : "", h("td", "", e.what), h("td", "mono wr", e.code), h("td", "", link(a.area, file(a.area))),
      h("td", "", others(e).map(x => h("div", "", link(x.part, file(x.part)), ": ",
        x.same === false ? "shares the code behind it" : x.status === "modelled" ? h("b", "", "models it too") : x.status === "ruled in" ? "takes it as given" : "leaves it out"))))));
  d.append(h("div", "tw", h("table", "", h("thead", "", h("tr", "", ["the code can", "where", "owned by", "also in"].map(x => h("th", "", x)))), tb)));
  return d; };
if (!Array.isArray(DATA) || !DATA.length) app.append(h("div", "empty", "No readback data. The checker has not filled in this page yet."));
else if (KIND === "index") {
  // One card per area. An area's parts are added up here; they are told apart on the area's own page.
  const by = new Map(); DATA.forEach(a => { const k = areaOf(a.area); if (!by.has(k)) by.set(k, []); by.get(k).push(a); });
  const sum = ps => { const z = { j: 0, jBad: 0, wBad: 0, c: 0, ok: 0, below: 0, bad: 0, q: 0, md: 0, out: 0, nr: 0, code: new Set() };
    ps.forEach(a => { const t = stats(a), sf = a.surface || [];
      z.j += (a.journeys || []).length; z.jBad += t.jBad; z.wBad += t.wBad; z.c += a.claims.length; z.ok += t.ok; z.below += t.below; z.bad += t.bad;
      z.q += a.questions.length; z.md += sf.filter(e => e.status === "modelled").length; z.out += sf.filter(e => e.status === "left out").length; z.nr += sf.filter(e => e.status === "not read").length;
      z.code.add(codeOf(a).status); });
    return z; };
  const nice = name => { const t = name.replace(/[-_]/g, " "); return t.charAt(0).toUpperCase() + t.slice(1); };
  const num = (k, one, many) => n(k) + " " + (k === 1 ? one : many || one + "s");
  const codeWord = c => c.has("drift") ? ["bad", "✕ code drifted from the model"] : c.has("error") ? ["bad", "✕ code check failed"]
    : c.has("agrees") ? (c.size === 1 ? ["good", "✓ code agrees with the model"] : ["warn", "▲ code checked only in part"]) : ["", "code not checked"];
  const red = z => z.bad + z.jBad + z.wBad > 0 || z.code.has("drift") || z.code.has("error");
  const card = (name, z) => { const cls = red(z) ? "violated" : z.below ? "below" : "ok", [cc, ct] = codeWord(z.code);
    const pill = (k, c, text) => k ? h("span", "pill " + c, text) : null;
    const bar = h("div", "meter", [["ok", z.ok], ["below", z.below], ["violated", z.bad]].filter(([, k]) => k).map(([c, k]) => {
      const x = h("span", c); x.style.flex = k + " 0 4px"; return x; }));
    bar.setAttribute("role", "img"); bar.setAttribute("aria-label", z.ok + " claims ok, " + z.below + " below target, " + z.bad + " violated");
    return link([
      h("div", "ctop", h("b", "", nice(name)), h("span", "badge " + cls, cls === "violated" ? "✕ needs attention" : cls === "below" ? "▲ below target" : "✓ ok")),
      h("p", "cnt", [num(z.j, "journey"), num(z.c, "claim"),
        z.md + z.out + z.nr ? n(z.md) + " of " + num(z.md + z.out + z.nr, "way", "ways") + " into the code modelled" : null].filter(Boolean).join(" · ")),
      z.c ? [bar, h("div", "leg", h("span", "mk ok", "✓ " + n(z.ok) + " ok"),
        z.below ? h("span", "mk below", "▲ " + n(z.below) + " below target") : null,
        z.bad ? h("span", "mk violated", "✕ " + n(z.bad) + " violated") : null)] : null,
      h("div", "pills", pill(z.jBad, "bad", "✕ " + num(z.jBad, "journey") + " failed"), pill(z.wBad, "bad", "✕ " + num(z.wBad, "walkthrough") + " failed"),
        pill(z.q, "ask", "? " + num(z.q, "open question")), pill(z.nr, "ask", num(z.nr, "way", "ways") + " into the code not read yet"), pill(z.out, "", num(z.out, "way", "ways") + " into the code left out"), pill(1, cc, ct))],
      file(name), "card " + cls); };
  const each = [...by].map(([name, ps]) => [name, sum(ps)]), all = sum(DATA);
  app.append(h("h1", "", "Readback"),
    h("p", "sub", "Every area as it stands. Open one to read its journeys, what is claimed and checked, and what is still yours to decide."));
  if (PAGE.since) app.append(h("p", "", link("What the change since " + short(PAGE.since) + " does, across areas", "change.html")));
  // counted from the code itself: what it offers, and what no part has said anything about
  const wi = Object.entries(PAGE.waysIn || {});
  if (wi.length) { const d = h("details", "row"), loose = wi.reduce((k, [, r]) => k + r.inNoPart.length, 0);
    d.append(h("summary", "", h("b", "", "Counted from the code: "), n(wi.reduce((k, [, r]) => k + r.found, 0)) + " ways in, ",
      loose ? h("span", "mk below", "▲ " + n(loose) + " in no part") : h("span", "mk ok", "✓ every one is in some part")));
    wi.forEach(([repo, r]) => { d.append(h("p", "", h("b", "", repo), ": " + n(r.found) + " in the code, " + n(r.inNoPart.length) + " in no part"));
      if (r.inNoPart.length) d.append(h("div", "mono wr cnt", r.inNoPart.map(x => h("div", "", x)))); });
    app.append(d); }
  app.append(h("div", "tiles",
      tile("", n(each.length), each.length === 1 ? "area" : "areas"), tile("", n(all.j), "journeys"),
      tile("good", n(all.ok), "✓ claims ok"), tile(all.below ? "warn" : "good", n(all.below), "▲ claims below target"),
      tile(all.bad ? "bad" : "good", n(all.bad), "✕ claims violated"), tile(all.q ? "warn" : "good", n(all.q), "? open questions")),
    h("div", "cards", each.map(([name, z]) => card(name, z))),
    h("p", "sub", h("b", "", "ok"), ": verified as strongly as asked. ", h("b", "", "below target"), ": holds as far as it was checked, but more weakly than asked. ",
      h("b", "", "violated"), ": the model breaks it; the area's page shows how."));
} else {
  const areas = KIND === "change" ? DATA.filter(a => changed(diff(a))) : DATA, since = PAGE.since ? short(PAGE.since) : "";
  app.append(h("h1", "", KIND === "change" ? "Readback of the change since " + since : "Readback: " + areaOf(DATA[0].area)),
    h("p", "nav", link("all areas", "index.html"),
      KIND === "area" && since ? [" · ", link("the change since " + since, "change.html")] : null,
      KIND === "change" ? areas.flatMap(a => [" · ", link(a.area + " as it stands", file(a.area))]) : null));
  if (!areas.length) app.append(h("div", "empty", "Nothing changed since " + since + "."));
  else {
    const body = h("div"), tabs = h("div", "tabs"); tabs.setAttribute("role", "tablist");
    let only = KIND === "change", cur = 0;
    const all = h("button", "tab", "open all");
    all.onclick = () => { const ds = [...body.querySelectorAll("details.sec")], open = ds.some(d => !d.open);
      ds.forEach(d => { d.open = open; }); all.textContent = open ? "close all" : "open all"; };
    const show = k => { cur = k; all.textContent = "open all"; [...tabs.children].forEach((b, j) => b.setAttribute("aria-selected", j === k)); body.replaceChildren(render(areas[k], only)); };
    areas.forEach((a, k) => { const bad = problem(a), b = h("button", "tab", KIND === "area" ? partOf(a.area) || a.area : a.area.replace("/", " / "),
        h("span", "mk " + (bad ? "violated" : "ok"), bad ? "▲ attention" : "✓ ok"));
      b.setAttribute("role", "tab"); b.onclick = () => show(k); tabs.append(b); });
    let tog = null;
    if (since) { const cb = h("input"); cb.type = "checkbox"; cb.checked = only; cb.onchange = () => { only = cb.checked; show(cur); };
      tog = h("label", "tog", cb, "only what changed"); }
    // the address names a part and, after "@", one journey of it: that journey is opened and brought into view
    const reveal = id => { const x = body.querySelector(".jx"); if (!x || !x.sel(id, false)) return;
      for (let e = x; e && e !== body; e = e.parentElement) if (e.tagName === "DETAILS") e.open = true;
      if (x.getBoundingClientRect().top < 0 || x.getBoundingClientRect().top > innerHeight * .6) x.scrollIntoView({ block: "start" }); };
    const go = first => { const [p, id] = decodeURIComponent(location.hash.slice(1)).split("@"), at = areas.findIndex(a => partOf(a.area) === p);
      if (first || (at >= 0 && at !== cur)) show(at >= 0 ? at : 0); if (id) reveal(id); };
    const ways = KIND === "area" ? sharedWays(areas) : null; if (ways) app.append(ways);
    app.append(h("div", "bar", areas.length > 1 ? tabs : null, all, tog), body); go(true);
    addEventListener("hashchange", () => go(false));
  }
}
</script></body></html>
