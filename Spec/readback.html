<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Readback</title>
<style>
:root{--bg:#f6f7f9;--surf:#fff;--ink:#1c2230;--mut:#5d667a;--line:#dde1e8;--acc:#2b5fd9;
--ok:#1a7f4b;--okb:#e3f4ea;--warn:#9a5b00;--warnb:#fff0d6;--bad:#c4271f;--badb:#fde6e4;--chg:#fff3b8}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--surf:#1b2029;--ink:#e6e9f0;--mut:#9aa3b5;--line:#2e3542;--acc:#7aa2ff;
--ok:#4cc38a;--okb:#14301f;--warn:#f0b44c;--warnb:#33270f;--bad:#ff7b72;--badb:#3a1816;--chg:#4a4210}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:16px}
.mono,code,td.v,.act{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:16px;margin:26px 0 8px}h3{font-size:13px;margin:14px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.sub{color:var(--mut);font-size:13px;margin:-4px 0 8px}
.sec{border-top:1px solid var(--line)}.sec[open]{padding-bottom:12px}
.sec>summary{cursor:pointer;display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;padding:11px 0;list-style:none}
.sec>summary::-webkit-details-marker{display:none}.sec>summary::before{content:"▸";color:var(--mut);width:12px}.sec[open]>summary::before{content:"▾"}
.sec>summary h2{margin:0}.sec>.sub{margin:0 0 8px}.cnt{color:var(--mut);font-size:13px}
.asm{margin:0 0 12px;padding-left:20px}.asm li{margin:3px 0}.asm li.gone{color:var(--mut);text-decoration:line-through}
button{font:inherit;color:inherit;background:var(--surf);border:1px solid var(--line);border-radius:6px;padding:3px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}button:disabled{opacity:.4;cursor:default}
button:focus-visible,.trace:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tab{display:flex;gap:6px;align-items:center;padding:6px 12px}
.tab[aria-selected=true]{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc);font-weight:600}
.mk{font-weight:700}.mk.ok{color:var(--ok)}.mk.below{color:var(--warn)}.mk.violated,.mk.failed{color:var(--bad)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(135px,100%),1fr));gap:8px}
.tile{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.tile b{display:block;font-size:24px;line-height:1.1}.tile span{font-size:12.5px;color:var(--mut)}
.tile.bad{background:var(--badb);border-color:var(--bad)}.tile.bad b{color:var(--bad)}
.tile.warn{background:var(--warnb);border-color:var(--warn)}.tile.warn b{color:var(--warn)}
.tile.good b{color:var(--ok)}.tile.wide{grid-column:span 2}.tile.wide b{font-size:15px;padding:4px 0}
.row{background:var(--surf);border:1px solid var(--line);border-left-width:5px;border-radius:8px;padding:8px 10px;margin-bottom:6px}
.row.ok{border-left-color:var(--ok)}.row.below{border-left-color:var(--warn)}.row.violated,.row.failed{border-left-color:var(--bad);background:var(--badb)}
.row.below{background:var(--warnb)}
.head>*{min-width:0}.head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.id{font-weight:700;font-size:12.5px;white-space:nowrap}
.verd{grid-column:2/4;font-size:13px;color:var(--mut)}
.lad{display:flex;align-items:center;gap:3px;white-space:nowrap;font-size:12px}
.pip{width:14px;height:10px;border-radius:2px;border:1.5px solid var(--mut)}
.pip.on{background:var(--ok);border-color:var(--ok)}.row.below .pip.on{background:var(--warn);border-color:var(--warn)}
.row.violated .pip.on{background:var(--bad);border-color:var(--bad)}
.pip.tgt{outline:2px solid var(--acc);outline-offset:1px}
.badge{font-size:12px;font-weight:700;border-radius:10px;padding:0 8px;border:1px solid currentColor;white-space:nowrap}
.badge.ok{color:var(--ok)}.badge.below{color:var(--warn)}.badge.violated,.badge.failed{color:var(--bad)}
.ex{padding:0;border-left-width:5px}.ex>summary{padding:8px 10px;cursor:pointer;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ex>div{padding:0 10px 10px}
.trace{margin-top:8px;outline:0}
.strip{display:flex;gap:4px;overflow-x:auto;padding-bottom:6px}
.st{flex:0 0 auto;max-width:200px;text-align:left;padding:3px 8px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st.cur{background:var(--acc);color:#fff;border-color:var(--acc)}
.st.ref{border-style:dashed;border-color:var(--bad);color:var(--bad)}.st.ref.cur{background:var(--bad);color:#fff}

.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;background:var(--surf);font-size:13px}
td,th{border:1px solid var(--line);padding:3px 8px;text-align:left;vertical-align:top}
td.v{word-break:break-word}td.f{white-space:nowrap;width:1%}
tr.chg td{background:var(--chg)}tr.dif td.v{background:var(--badb);color:var(--bad);font-weight:600}.old{text-decoration:line-through;color:var(--mut);margin-right:8px}
.note{font-size:13px;color:var(--bad);font-weight:600}
.dg{background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:6px;margin-bottom:8px;overflow-x:auto}
.dg svg{display:block}.dg text{font:12px ui-monospace,Menlo,Consolas,monospace;fill:var(--ink)}
.dg .nd{fill:var(--surf);stroke:var(--mut);stroke-width:1.5}.dg .ini{stroke:var(--acc);stroke-width:3;fill:var(--surf)}
.dg .ed{fill:none;stroke:var(--mut);stroke-width:1.4}.dg .lb{stroke:var(--surf);stroke-width:4;paint-order:stroke;fill:var(--acc)}
.dg .tag{fill:var(--acc);font-size:10px}
.q{background:var(--surf);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:8px;padding:8px 10px;margin-bottom:6px}
.q>p{margin:0 0 4px}
.cv{display:flex;gap:8px;align-items:baseline}.cv .mk{white-space:nowrap}
pre{margin:6px 0;padding:6px 8px;background:var(--surf);border:1px solid var(--line);border-radius:6px;max-height:220px;overflow:auto;white-space:pre-wrap;word-break:break-word}
td.c{white-space:pre-wrap;word-break:break-word}
.bar{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:flex-start;margin-bottom:14px}.bar .tabs{margin:0}
.tog{display:flex;gap:6px;align-items:center;padding:6px 0;font-size:13px;cursor:pointer}
.chgd{font-size:12px;font-weight:700;color:var(--acc)}
.cb{background:var(--surf);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:8px;padding:8px 10px;margin:12px 0}
.cb p{margin:4px 0 0}.w{color:var(--bad);font-weight:700}
.badge.new{color:var(--acc)}.badge.rm{color:var(--mut)}.badge.weak{background:var(--bad);color:var(--bg);border-color:var(--bad)}
.mks{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}.mk2{display:inline-flex;gap:6px;align-items:baseline}
.was{color:var(--mut);font-size:13px}.was .old{margin:0}
.row.rm,.q.rm{background:transparent;border-style:dashed;border-left-style:solid;border-left-color:var(--line);color:var(--mut)}.tx{text-decoration:line-through}
.jr>summary b{font-size:15px}.goal{margin:2px 0 6px}.given{margin:0 0 10px;font-size:13.5px}
.fs{display:flex;flex-wrap:wrap;align-items:stretch;gap:0 0;margin-bottom:8px}.fs>.mo{flex:1 1 320px;max-width:560px;margin-bottom:0}
.lvs{flex:1 1 240px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:4px 0}
.leaf{position:relative;margin-left:26px;border:1px dashed var(--warn);background:var(--warnb);border-radius:8px;padding:5px 9px;font-size:13px}
.leaf::before{content:"";position:absolute;left:-27px;top:50%;width:26px;border-top:2px dashed var(--warn)}
.leaf .lid{color:var(--mut);font-size:11.5px;white-space:nowrap}
.leaf .lw{display:block;font-size:12px;color:var(--mut)}.leaf .lw.none{color:var(--bad);font-weight:600}
.again{display:flex;align-items:center;gap:6px;margin:0 0 4px;font-size:13px;font-weight:600;color:var(--acc)}.lp{width:18px;height:18px;flex:0 0 auto}
.fs.loop>.mo{border-color:var(--acc)}.outc{font-size:13px;color:var(--ok);font-weight:600;margin:2px 0}
.tl{position:relative;padding-left:36px}.tl::before{content:"";position:absolute;left:11px;top:14px;bottom:14px;width:2px;background:var(--line)}
.mo{position:relative;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.dot{position:absolute;left:-36px;top:7px;width:24px;height:24px;border-radius:50%;background:var(--surf);border:2px solid var(--acc);font-size:12px;font-weight:700;text-align:center;line-height:20px}
.mo.ref{border:1px dashed var(--warn);background:var(--warnb)}.mo.ref .dot{border:2px dashed var(--warn)}
.mo.bad{border:1px solid var(--bad);border-left-width:5px;background:var(--badb)}.mo.bad .dot{border-color:var(--bad);color:var(--bad)}
.say{font-size:15.5px;font-weight:600;margin:0 0 4px}.badge.ref{color:var(--warn);margin-right:6px;font-weight:700}
.chip{font:12px ui-monospace,Menlo,Consolas,monospace;padding:0 7px;border-radius:10px;margin:0 4px 4px 0;color:var(--acc)}
.chip[aria-expanded=true]{background:var(--acc);color:var(--bg)}
.rt{font-size:13px;margin:2px 0;color:var(--mut)}.rt b{color:var(--ink)}
.dl.vw{font-size:13.5px}.raw{margin-top:2px}.raw summary{cursor:pointer}
.dl{font-size:12px;color:var(--ink);word-break:break-word}.dl div{margin:1px 0}.dl .f{font-weight:700}
.mo .act{display:block;color:var(--mut);font-size:12px;margin-top:3px;word-break:break-word}
.jl{font-size:12px}
.empty{text-align:center;color:var(--mut);padding:60px 0}
.nav{font-size:13.5px;margin:-6px 0 12px}a{color:var(--acc)}
.arow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;text-decoration:none;color:var(--ink);padding:10px 12px}.arow b{font-size:16px}
@media (max-width:560px){.head{grid-template-columns:auto minmax(0,1fr)}.lad,.badge,.mks{grid-column:2}.tile.wide{grid-column:span 1}}
</style></head><body><main id="app"></main>
<script>
const DATA = /*DATA*/[];
const PAGE = /*PAGE*/{};

const h = (t, c, ...k) => { const e = document.createElement(t); if (c) e.className = c;
  for (const x of k.flat()) if (x != null) e.append(x.nodeType ? x : document.createTextNode(x)); return e; };
const NS = "http://www.w3.org/2000/svg";
const s = (t, a, text) => { const e = document.createElementNS(NS, t);
  for (const k in a) e.setAttribute(k, a[k]); if (text != null) e.textContent = text; return e; };
const n = x => Number(x).toLocaleString();
const CLS = { "ok": "ok", "below target": "below", "violated": "violated", "failed": "failed" };
const ICON = { ok: "✓ ok", below: "▲ below target", violated: "✕ violated", failed: "✕ failed" };
const LEVEL = { 1: "proven", 2: "all reachable states", 3: "bounded search", 5: "not verified" };
const PIPS = { 1: 3, 2: 2, 3: 1, 5: 0 };

// ---- trace stepper ----
function stepper(steps) {
  let i = steps.length - 1;
  const box = h("div", "trace"); box.tabIndex = 0;
  const strip = h("div", "strip"), ctl = h("div", "ctl"), tw = h("div", "tw");
  const prev = h("button", "", "← prev"), next = h("button", "", "next →"), pos = h("span");
  const label = (st, k) => (k ? k + ". " : "") + (k === 0 ? "start" : st.action) + (st.refused ? " ✕ refused" : "");
  const btns = steps.map((st, k) => { const b = h("button", "st" + (st.refused ? " ref" : ""), label(st, k));
    b.title = label(st, k); b.onclick = () => { i = k; draw(); }; strip.append(b); return b; });
  function draw() {
    btns.forEach((b, k) => { b.classList.toggle("cur", k === i); b.setAttribute("aria-current", k === i); });
    btns[i].scrollIntoView({ block: "nearest", inline: "nearest" });
    prev.disabled = i === 0; next.disabled = i === steps.length - 1;
    const st = steps[i];
    pos.textContent = "step " + i + " of " + (steps.length - 1) + (i === 0 ? " (initial state)" : "");
    const before = i > 0 ? new Map(steps[i - 1].state) : new Map();
    const t = h("table"); const body = h("tbody");
    for (const [f, v] of st.state) {
      const changed = i > 0 && before.has(f) ? before.get(f) !== v : i > 0;
      const td = h("td", "v"); if (changed) td.append(h("span", "old", before.get(f) ?? "(new)"));
      const dif = /^.* in the model, .* in the code$/s.test(v); td.append(v);
      body.append(h("tr", dif ? "dif" : changed ? "chg" : "", h("td", "f mono", f), td));
    }
    t.append(body); tw.replaceChildren(
      st.refused ? h("div", "note", "✕ This action was refused; nothing changed.") : "", t);
  }
  prev.onclick = () => { if (i > 0) { i--; draw(); } };
  next.onclick = () => { if (i < steps.length - 1) { i++; draw(); } };
  box.onkeydown = e => { if (e.key === "ArrowLeft") { prev.onclick(); e.preventDefault(); }
    if (e.key === "ArrowRight") { next.onclick(); e.preventDefault(); } };
  ctl.append(prev, next, pos, h("span", "sub", "changed fields are highlighted; old value struck through"));
  box.append(strip, ctl, tw); draw(); return box;
}

// where a claim or journey comes from: a history, oldest first
const origin = x => (x.sources || []).length ? "from: " + x.sources.join(", then: ") : "origin not recorded";

// ---- state diagram ----
function diagram(v) {
  const names = [...new Set([v.initial, ...v.edges.flatMap(e => [e[0], e[2]])])];
  const out = {}; names.forEach(x => out[x] = []);
  v.edges.forEach(e => out[e[0]].push(e[2]));
  const layer = {}; let queue = [v.initial]; layer[v.initial] = 0;
  const bfs = () => { while (queue.length) { const a = queue.shift();
    for (const b of out[a]) if (!(b in layer)) { layer[b] = layer[a] + 1; queue.push(b); } } };
  bfs();
  for (const x of names) if (!(x in layer)) { layer[x] = 0; queue = [x]; bfs(); }
  const nl = Math.max(...Object.values(layer)) + 1;
  const cols = Array.from({ length: nl }, () => []); names.forEach(x => cols[layer[x]].push(x));
  const W = x => Math.max(60, x.length * 7.4 + 20), H = 30, RY = 78;
  const labels = new Map(); // "from\0to" -> [actions]
  for (const [a, act, b] of v.edges) { const k = a + "\0" + b; if (!labels.has(k)) labels.set(k, []);
    if (!labels.get(k).includes(act)) labels.get(k).push(act); }
  const lw = cols.map(c => Math.max(...c.map(W)));
  const maxLab = Math.max(0, ...[...labels.values()].map(l => l.join(", ").length * 7)) ;
  const gap = Math.min(220, Math.max(70, maxLab + 24));
  const pos = {}; let x = 20; const rows = Math.max(...cols.map(c => c.length));
  cols.forEach((c, li) => { c.forEach((nm, r) => pos[nm] = { x: x + lw[li] / 2, y: 50 + r * RY + (rows - c.length) * RY / 2, w: W(nm) });
    x += lw[li] + gap; });
  const backs = [...labels.keys()].map(k => k.split("\0")).filter(([a, b]) => a !== b && layer[b] <= layer[a])
    .map(([a, b]) => 40 + 40 * Math.abs(layer[a] - layer[b]));  // room for the curved back edges
  const width = x - gap + 20, height = 50 + (rows - 1) * RY + 40 + Math.max(0, ...backs) / 2;
  const svg = s("svg", { width, height, viewBox: `0 0 ${width} ${height}`, role: "img", "aria-label": "state diagram " + v.name });
  svg.append(s("defs", {}), s("title", {}, v.name));
  const defs = svg.firstChild, mk = s("marker", { id: "ar", viewBox: "0 0 10 10", refX: 9, refY: 5, markerWidth: 7, markerHeight: 7, orient: "auto" });
  mk.append(s("path", { d: "M0 0L10 5L0 10z", fill: "currentColor" })); defs.append(mk);
  svg.style.color = "var(--mut)";
  const edge = (p, c) => { // clip toward point c to node rectangle
    const dx = c.x - p.x, dy = c.y - p.y, t = Math.min(dx ? (p.w / 2 + 2) / Math.abs(dx) : 1e9, dy ? (H / 2 + 2) / Math.abs(dy) : 1e9);
    return { x: p.x + dx * t, y: p.y + dy * t }; };
  for (const [k, acts] of labels) {
    const [a, b] = k.split("\0"), A = pos[a], B = pos[b], text = acts.join(", ");
    let d, lx, ly;
    if (a === b) { d = `M${A.x - 14} ${A.y - H / 2} C${A.x - 30} ${A.y - H / 2 - 36} ${A.x + 30} ${A.y - H / 2 - 36} ${A.x + 14} ${A.y - H / 2 - 2}`;
      lx = A.x; ly = A.y - H / 2 - 32; }
    else {
      const back = layer[b] <= layer[a], rev = labels.has(b + "\0" + a);
      const dx = B.x - A.x, dy = B.y - A.y, len = Math.hypot(dx, dy) || 1;
      const off = back ? 40 + 40 * Math.abs(layer[a] - layer[b]) : (rev || Math.abs(layer[b] - layer[a]) > 1 ? 24 : 0);
      const c = { x: (A.x + B.x) / 2 + dy / len * off, y: (A.y + B.y) / 2 - dx / len * off };
      const p = edge(A, c), q = edge(B, c);
      d = `M${p.x} ${p.y} Q${c.x} ${c.y} ${q.x} ${q.y}`;
      lx = .25 * p.x + .5 * c.x + .25 * q.x; ly = .25 * p.y + .5 * c.y + .25 * q.y;
    }
    const path = s("path", { d, class: "ed", "marker-end": "url(#ar)" }); svg.append(path);
    const lab = s("text", { x: lx, y: ly + 4, "text-anchor": "middle", class: "lb" }, text); svg.append(lab);
  }
  for (const nm of names) { const p = pos[nm];
    svg.append(s("rect", { x: p.x - p.w / 2, y: p.y - H / 2, width: p.w, height: H, rx: 8, class: "nd" + (nm === v.initial ? " ini" : "") }),
      s("text", { x: p.x, y: p.y + 4, "text-anchor": "middle" }, nm));
    if (nm === v.initial) svg.append(s("text", { x: p.x, y: p.y + H / 2 + 14, "text-anchor": "middle", class: "tag" }, "▶ START")); }
  return h("div", "dg", svg);
}

// ---- sections ----
function ladder(c, cls) {
  const on = PIPS[c.level] ?? 0, tg = PIPS[c.target] ?? 0, box = h("span", "lad");
  box.title = "reached: " + (LEVEL[c.level] || c.level) + "; target: " + (LEVEL[c.target] || c.target);
  for (let k = 1; k <= 3; k++) box.append(h("span", "pip" + (k <= on ? " on" : "") + (k === tg ? " tgt" : "")));
  box.append(h("span", "", "level " + c.level + " / target " + c.target)); return box;
}
function claimRow(c, ms, jl) {
  const cls = CLS[c.status] || "below", r = h("div", "row " + cls);
  r.append(h("div", "head", h("span", "id mono", c.id), h("span", "", c.text), h("span", "badge " + cls, ICON[cls]),
    ms ? h("span", "mks", ms.map(mark)) : null, h("span", "verd", c.verdict), jl ? h("span", "verd jl", jl) : null,
    h("span", "verd jl", origin(c)), ladder(c, cls)));
  if (c.steps && c.steps.length) { const box = h("div"); const b = h("button", "", "show counterexample"); b.style.marginTop = "6px";
    b.onclick = () => { if (box.firstChild) { box.replaceChildren(); b.textContent = "show counterexample"; }
      else { box.append(stepper(c.steps)); b.textContent = "hide counterexample"; } };
    r.append(b, box); }
  return r;
}
function questionRow(q, isNew) {
  const r = h("div", "q", h("p", "", isNew ? h("span", "badge new", "new") : null, isNew ? " " : "", "? ", q.text));
  if (q.steps && q.steps.length) { const box = h("div"), b = h("button", "", "show situation");
    b.onclick = () => { if (box.firstChild) { box.replaceChildren(); b.textContent = "show situation"; }
      else { box.append(stepper(q.steps)); b.textContent = "hide situation"; } };
    r.append(b, box); }
  return r;
}
// ---- journeys and walkthroughs ----
// One card of a timeline: a moment of a walkthrough, or a step of a journey.
function moment(m, i, prev, req, prevV) {
  const bad = m.asTold === false || m.outcome === false, more = h("div");
  const chips = (m.requirements || []).map(id => { const t = req.get(id) || "(not a requirement of this area)";
    const b = h("button", "chip", id), p = h("p", "rt", h("b", "mono", id + " "), t);
    b.title = t; b.setAttribute("aria-expanded", "false"); p.hidden = true;
    b.onclick = () => { p.hidden = !p.hidden; b.setAttribute("aria-expanded", String(!p.hidden)); }; more.append(p); return b; });

      .append(h("div", "tw", h("table", "", tb))); }
  root.append(det);
  return root;
}

// ---- page ----
// Three kinds of page come from this template: one per area (the area as it stands),
// one for a change (every area the change touches, and what it did there), and the list of areas.
const app = document.getElementById("app"), KIND = PAGE.kind || "area";
const link = (text, href, cls) => { const x = h("a", cls || "", text); x.href = href; return x; };
const file = name => encodeURIComponent(name) + ".html";
const pl = (k, one) => k + " " + one + (k === 1 ? "" : "s");
if (!Array.isArray(DATA) || !DATA.length) app.append(h("div", "empty", "No readback data. The checker has not filled in this page yet."));
else if (KIND === "index") {
  app.append(h("h1", "", "Readback"), h("p", "sub", "One page per area: the area as it stands."));
  if (PAGE.since) app.append(h("p", "", link("What the change since " + short(PAGE.since) + " does, across areas", "change.html")));
  DATA.forEach(a => { const t = stats(a), bad = problem(a), k = x => (x || []).length;
    app.append(link([h("b", "", a.area), h("span", "mk " + (bad ? "violated" : "ok"), bad ? "▲ attention" : "✓ ok"),
      h("span", "cnt", [pl(k(a.journeys), "journey"), pl(k(a.walkthroughs), "walkthrough"), pl(a.claims.length, "claim"),
        t.bad ? t.bad + " violated" : null, t.below ? t.below + " below target" : null,
        pl(k(a.questions), "open question"), "code " + codeOf(a).status].filter(Boolean).join(" · "))],
      file(a.area), "row arow " + (bad ? "failed" : "ok"))); });
} else {
  const areas = KIND === "change" ? DATA.filter(a => changed(diff(a))) : DATA, since = PAGE.since ? short(PAGE.since) : "";
  app.append(h("h1", "", KIND === "change" ? "Readback of the change since " + since : "Readback: " + DATA[0].area),
    h("p", "nav", link("all areas", "index.html"),
      KIND === "area" && since ? [" · ", link("the change since " + since, "change.html")] : null,
      KIND === "change" ? areas.flatMap(a => [" · ", link(a.area + " as it stands", file(a.area))]) : null));
  if (!areas.length) app.append(h("div", "empty", "Nothing changed since " + since + "."));
  else {
    const body = h("div"), tabs = h("div", "tabs"); tabs.setAttribute("role", "tablist");
    let only = KIND === "change", cur = 0;
    const all = h("button", "tab", "open all");
    all.onclick = () => { const ds = [...body.querySelectorAll("details.sec")], open = ds.some(d => !d.open);
      ds.forEach(d => { d.open = open; }); all.textContent = open ? "close all" : "open all"; };
    const show = k => { cur = k; all.textContent = "open all"; [...tabs.children].forEach((b, j) => b.setAttribute("aria-selected", j === k)); body.replaceChildren(render(areas[k], only)); };
    areas.forEach((a, k) => { const bad = problem(a), b = h("button", "tab", a.area,
        h("span", "mk " + (bad ? "violated" : "ok"), bad ? "▲ attention" : "✓ ok"));
      b.setAttribute("role", "tab"); b.onclick = () => show(k); tabs.append(b); });
    let tog = null;
    if (since) { const cb = h("input"); cb.type = "checkbox"; cb.checked = only; cb.onchange = () => { only = cb.checked; show(cur); };
      tog = h("label", "tog", cb, "only what changed"); }
    app.append(h("div", "bar", areas.length > 1 ? tabs : null, all, tog), body); show(0);
  }
}
</script></body></html>
