name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      # Audits the proofs, searches every area, fails on any violated claim.
      - run: lake exe spec
      # The committed ledger must be what the checker produces.
      - run: test -z "$(git status --porcelain ledger)" || (git status --porcelain ledger; git diff ledger; exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review
          path: out/review.html
