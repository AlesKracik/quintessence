# Spec CI — runs on every PR touching specs/ or .spec/.
#
# Gates, in order of cost:
#   1. spec-lint            — jsonschema validation, structural consistency,
#                             EARS structure, witness obligations (trace
#                             present, valid ITF, fresh model_sha), and
#                             completeness: every action a requirement or
#                             verdict speaks to, every observable change one
#                             a requirement names, every external outcome
#                             answered, and no recorded coverage /
#                             explanation / verdict counterexample
#   2. probe modules current — the generated obligations and completeness
#                             checks match the model
#   3. quint typecheck      — sidecars and probe modules still compile
#   4. quint test           — the model's `run` scenarios still pass, on the
#                             Rust evaluator (QUINT_EVAL_BACKEND to override;
#                             probed, so an older quint without --backend
#                             still runs the gate)
#
# QUINT_IR_ENGINE=cli pins lint to the Quint compiler's typed IR — verdicts
# here never depend on the lossy regex fallback. It is set on the spec-gates
# job only, since that is the job that installs the CLI: with the var set and
# the CLI absent, spec-lint FAILs quint/engine-unavailable and spec-record
# refuses to run, rather than reporting clean over sidecars that all parsed
# as "no module".
#
# Deliberately NOT here, because both need the CODE repo checked out, which a
# spec repo's CI does not have in the multi-repo case:
#   tools/spec-extract-audit.py  (code -> spec coverage)
#   spec-record equiv            (differential vs the original implementation)
# Wire those into the CODE repo's CI instead, where the source actually is.
#
# Apalache model checking (/spec-check) and conformance replay (/spec-code-verify)
# are heavier and agent-driven; run them locally or scheduled. The optional
# Alloy backend is agent-driven for the same reason and needs no jar here:
# spec-lint's gate on proof: "structural" invariants is regex-only Python. The
# optional Lean backend gets its own job (lean-proofs): it needs a Lean
# toolchain to rebuild what spec-lint can only inspect. ALSO wire each
# area's conformance.command into the CODE repo's own CI — the replay harness
# is an ordinary test file and needs no spec tooling.
#
# In the template repo itself (before bootstrap, while examples/ exists),
# `example-gates` runs the same kind of gates over examples/ — the examples
# are the methodology's own regression suite, and nothing else checks that
# they still compile and run.
#
# This file ships with the template; adjust paths/commands to your project.

name: spec-ci

on:
  pull_request:
    paths:
      - "specs/**"
      - ".spec/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "specs/**"
      - ".spec/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - "examples/**"
      - ".github/workflows/**"

jobs:
  # The tooling's own unit + regression suite. Deliberately NOT gated on
  # .spec/project.json the way spec-gates below is: these test tools/, not a
  # project's specs, so this is the one job that must run in the template repo
  # itself — which is exactly where tools/ gets edited. Pure Python, no
  # quint/Apalache/Java, so it costs a checkout and a pip install.
  #
  # tests/ survives bootstrap on purpose: a project created from the template
  # ships these tools and keeps their tests. The few template-only assertions
  # skip themselves once the files they inspect are gone.
  tool-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest jsonschema

      - name: pytest (tools/ unit + regression suite)
        run: python -m pytest tests/ -q

  spec-gates:
    runs-on: ubuntu-latest
    # Scoped to this job, not the workflow: it pins lint to the Quint
    # compiler's typed IR, and only this job installs the Quint CLI. Set
    # workflow-wide it also reached tool-tests, where the CLI is absent, so
    # every sidecar silently parsed as "no module" and the checks that read
    # one quietly passed on nothing.
    env:
      QUINT_IR_ENGINE: cli
    steps:
      - uses: actions/checkout@v4

      # Template-repo guard: before bootstrap there is no .spec/project.json,
      # so every gate below would fail on its own repo's PRs. Skip cleanly.
      - name: Detect bootstrapped project
        id: boot
        run: |
          if [ -f .spec/project.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "No .spec/project.json — template repo, spec gates skipped."
          fi

      - uses: actions/setup-python@v5
        if: steps.boot.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.boot.outputs.ok == 'true'
        with:
          node-version: "20"

      - name: Install Quint CLI + jsonschema
        if: steps.boot.outputs.ok == 'true'
        run: |
          npm install -g @informalsystems/quint
          pip install jsonschema

      - name: spec-lint (jsonschema + consistency + EARS + witness obligations + freshness)
        if: steps.boot.outputs.ok == 'true'
        run: python tools/spec-lint.py --no-color

      - name: Probe modules current (areas that declare probe_domains)
        if: steps.boot.outputs.ok == 'true'
        run: |
          set -e
          # Opt-in by construction: only areas that declare
          # formal_model.probe_domains have adopted the generator, so a project
          # still hand-writing its probe module is not failed for it. For the
          # ones that have, a stale module means every witness was checked
          # against something that no longer matches the model.
          areas=$(python -c "import json,pathlib; print(' '.join(p.name[:-len('.intent.json')] for p in sorted(pathlib.Path('specs').glob('*.intent.json')) if (json.loads(p.read_text(encoding='utf-8')).get('formal_model') or {}).get('probe_domains')))")
          for area in $areas; do
            echo "── probes: $area"
            python tools/spec-probes.py "$area" --check
          done

      - name: Run traces current (areas with a conformance harness)
        if: steps.boot.outputs.ok == 'true'
        run: |
          set -e
          # The code repo's harness replays every example and journey run from
          # specs/<area>/traces/runs/ (tools/spec-runs.py). A trace older than
          # the model replays an older spec, so it fails here, before the
          # code repo's CI trusts it.
          areas=$(python -c "import json,pathlib; print(' '.join(p.name[:-len('.intent.json')] for p in sorted(pathlib.Path('specs').glob('*.intent.json')) if (json.loads(p.read_text(encoding='utf-8')).get('conformance') or {}).get('command')))")
          for area in $areas; do
            echo "── run traces: $area"
            python tools/spec-runs.py "$area" --check
          done

      - name: Quint typecheck (sidecars + probe modules)
        if: steps.boot.outputs.ok == 'true'
        run: |
          set -e
          for f in specs/*.qnt; do
            echo "── typecheck: $f"
            quint typecheck "$f"
          done

      - name: Quint test (run scenarios in the models)
        if: steps.boot.outputs.ok == 'true'
        run: |
          set -e
          shopt -s nullglob
          # The Rust evaluator is the fast one, but --backend landed after
          # the flag-less releases. Probe --help rather than pinning a
          # version: an older quint then runs exactly the command it ran
          # before, instead of failing the gate on an unknown flag.
          backend=""
          if quint test --help 2>&1 | grep -q -- "--backend"; then
            backend="--backend=${QUINT_EVAL_BACKEND:-rust}"
            echo "── evaluator: ${QUINT_EVAL_BACKEND:-rust}"
          fi
          for f in specs/*.qnt; do
            case "$f" in *.probes.qnt) continue;; esac
            # quint test only runs `run`s whose name matches --match, and its
            # default is /Test$/ — none of a spec's scenarios are named that
            # way, so without an explicit match this gate ran nothing.
            runs=$(python tools/quint_ir.py "$f" --json | python -c "import json,sys; print('|'.join(json.load(sys.stdin).get('runs') or []))")
            if [ -z "$runs" ]; then echo "── test: $f (no runs)"; continue; fi
            echo "── test: $f ($runs)"
            quint test $backend --match "^($runs)\$" "$f" || exit 1
          done

  # The optional Lean backend (proof: "lean"). spec-lint is pure Python and
  # cannot rebuild a proof, so this job does what lint cannot: builds the
  # Lake project, re-audits every Lean verdict (the statement it proves, the
  # axioms it rests on, the trace replay against the Quint model) and fails
  # if one no longer matches its record, then re-checks the built
  # environment with lean4checker — which catches a proof that tampered
  # with the elaborator, since the audit reads what the elaborator says.
  # Skips itself where no Lake project exists, so an area that never opts
  # in pays nothing. Runs on specs/ in a project and on examples/ in the
  # template repo.
  lean-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the Lake projects
        id: lean
        run: |
          roots=""
          for r in . examples; do
            dir=$(python3 -c "import json,sys,pathlib; p=pathlib.Path(sys.argv[1])/'.spec/project.json'; print((json.loads(p.read_text()).get('lean') or {}).get('project_dir','specs/lean') if p.exists() else '')" "$r")
            if [ -n "$dir" ] && [ -f "$r/$dir/lakefile.toml" ]; then roots="$roots $r:$dir"; fi
          done
          echo "roots=$roots" >> "$GITHUB_OUTPUT"
          [ -n "$roots" ] || echo "No Lake project — Lean gates skipped."

      - uses: actions/setup-python@v5
        if: steps.lean.outputs.roots != ''
        with:
          python-version: "3.12"

      # The Lean model of a proof is generated from the Quint model's typed IR
      # (tools/lean_gen.py), so the audit needs the Quint CLI too.
      - uses: actions/setup-node@v4
        if: steps.lean.outputs.roots != ''
        with:
          node-version: "20"

      - name: Install Quint CLI
        if: steps.lean.outputs.roots != ''
        run: npm install -g @informalsystems/quint

      - name: Install elan (the toolchain comes from each project's lean-toolchain)
        if: steps.lean.outputs.roots != ''
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Build, audit and kernel-recheck every Lean proof
        if: steps.lean.outputs.roots != ''
        run: |
          set -e
          for entry in ${{ steps.lean.outputs.roots }}; do
            root=${entry%%:*}; dir=${entry#*:}
            echo "── lake build: $root/$dir"
            (cd "$root/$dir" && lake build)
            echo "── audit: $root"
            python tools/lean_backend.py audit --root "$root"
            # lean4checker is tagged per Lean release; build the one matching
            # this project's toolchain and replay every module it compiled.
            chain=$(cat "$root/$dir/lean-toolchain"); tag=${chain##*:}
            if [ ! -d "$RUNNER_TEMP/lean4checker-$tag" ]; then
              git clone -q --depth 1 --branch "$tag" https://github.com/leanprover/lean4checker "$RUNNER_TEMP/lean4checker-$tag"
              (cd "$RUNNER_TEMP/lean4checker-$tag" && lake build)
            fi
            modules=$(cd "$root/$dir" && find . -name '*.lean' -not -path './.lake/*' -not -name lakefile.lean | sed 's|^\./||; s|\.lean$||; s|/|.|g' | sort)
            echo "── lean4checker: $modules"
            (cd "$root/$dir" && lake env "$RUNNER_TEMP/lean4checker-$tag/.lake/build/bin/lean4checker" $modules)
          done

  # Template repo only: examples/ is stripped by bootstrap, so in a project
  # this job skips itself. The examples are what the methodology points
  # people at; an example model that no longer typechecks, a run that no
  # longer passes, or a lint FAIL in them teaches the wrong thing. Same
  # checks the spec gates run on a project, aimed at examples/, plus the
  # tool tests again with the Quint CLI present so the ones that compare
  # the Python reader against `quint parse` actually run.
  example-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect template repo
        id: tpl
        run: |
          if [ -d examples/specs ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "No examples/ — bootstrapped project, example gates skipped."
          fi

      - uses: actions/setup-python@v5
        if: steps.tpl.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.tpl.outputs.ok == 'true'
        with:
          node-version: "22"

      - name: Install Quint CLI + test dependencies
        if: steps.tpl.outputs.ok == 'true'
        run: |
          npm install -g @informalsystems/quint
          quint --version
          pip install pytest jsonschema

      # Each gate below runs through `annotate`: on failure the tail of its
      # output is also emitted as an error annotation, so the reason shows on
      # the PR's checks page (and through the API) without opening raw logs.
      - name: Define the failure annotator
        if: steps.tpl.outputs.ok == 'true'
        run: |
          cat > "$RUNNER_TEMP/annotate.sh" <<'SH'
          #!/usr/bin/env bash
          # usage: annotate.sh <title> <command...>
          title="$1"; shift
          out="$RUNNER_TEMP/annotate.out"
          "$@" > "$out" 2>&1; code=$?
          cat "$out"
          if [ $code -ne 0 ]; then
            msg=$(tail -n 150 "$out" | sed 's/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=$title::$msg"
          fi
          exit $code
          SH
          chmod +x "$RUNNER_TEMP/annotate.sh"

      - name: Quint typecheck (example models + probe modules)
        if: steps.tpl.outputs.ok == 'true'
        working-directory: examples
        run: |
          set -e
          for f in specs/*.qnt; do
            echo "── typecheck: $f"
            "$RUNNER_TEMP/annotate.sh" "quint typecheck $f" quint typecheck "$f"
          done

      - name: Quint test (every run in the example models)
        if: steps.tpl.outputs.ok == 'true'
        working-directory: examples
        run: |
          set -e
          backend=""
          if quint test --help 2>&1 | grep -q -- "--backend"; then
            backend="--backend=${QUINT_EVAL_BACKEND:-rust}"
          fi
          status=0
          for f in specs/*.qnt; do
            case "$f" in *.probes.qnt) continue;; esac
            runs=$(python ../tools/quint_ir.py "$f" --json | python -c "import json,sys; print('|'.join(json.load(sys.stdin).get('runs') or []))")
            if [ -z "$runs" ]; then echo "── test: $f (no runs)"; continue; fi
            echo "── test: $f ($runs)"
            # Every model is tested even after one fails: the annotations
            # then name every broken run in one CI round, not one per push.
            "$RUNNER_TEMP/annotate.sh" "quint test $f" quint test $backend --match "^($runs)\$" "$f" || status=1
          done
          exit $status

      - name: Probe modules current (examples)
        if: steps.tpl.outputs.ok == 'true'
        run: |
          status=0
          areas=$(python -c "import json,pathlib; print(' '.join(p.name[:-len('.intent.json')] for p in sorted(pathlib.Path('examples/specs').glob('*.intent.json')) if (json.loads(p.read_text(encoding='utf-8')).get('formal_model') or {}).get('probe_domains')))")
          for area in $areas; do
            "$RUNNER_TEMP/annotate.sh" "probes $area" python tools/spec-probes.py --root examples "$area" --check || status=1
          done
          exit $status

      # The cheap half of /spec-check, as a regression gate on the examples:
      # the simulator explores random runs of every model with a probe
      # module, checking each invariant, obligation and completeness check
      # (coverage, explanation, verdicts) on the way and counting the runs
      # that reach each requirement's behavior. Any of them broken in a run,
      # or a requirement no run reaches, fails the gate. Not a verdict — the model
      # checker gives those — but an example whose requirement became
      # unreachable, or whose invariant broke, is caught on the PR that did
      # it. Seeded, so a run is reproducible; 20 steps, because the lockout
      # needs five failures in a row.
      - name: Simulate the examples (invariants hold, every requirement reached)
        if: steps.tpl.outputs.ok == 'true'
        run: |
          status=0
          areas=$(python -c "import json,pathlib; print(' '.join(p.name[:-len('.intent.json')] for p in sorted(pathlib.Path('examples/specs').glob('*.intent.json')) if (json.loads(p.read_text(encoding='utf-8')).get('formal_model') or {}).get('probes_file')))")
          for area in $areas; do
            echo "── simulate: $area"
            out=$("$RUNNER_TEMP/annotate.sh" "simulate $area" python tools/spec-record.py check "$area" --root examples --only-simulate --strict --steps 20 --samples 10000 --seed 7) || status=1
            echo "$out"
            # What was explored and reached, on the checks page whether or
            # not it passed: a gate that only speaks when it fails cannot be
            # told apart from one that checked nothing.
            summary=$(echo "$out" | grep -E "^simulate" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=simulate $area::$summary"
          done
          exit $status

      # Every example and journey run as the trace a code repo's harness
      # replays: generated with the real quint, then checked current. The
      # examples have no implementation to replay against, so this proves the
      # generator, and shows what it produced.
      - name: Run traces of the examples
        if: steps.tpl.outputs.ok == 'true'
        run: |
          status=0
          for area in auth auth-ui subscription; do
            out=$("$RUNNER_TEMP/annotate.sh" "run traces $area" python tools/spec-runs.py "$area" --root examples) || status=1
            echo "$out"
            "$RUNNER_TEMP/annotate.sh" "run traces $area current" python tools/spec-runs.py "$area" --root examples --check > /dev/null || status=1
            msg=$(echo "$out" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::notice title=run traces $area::$msg"
          done
          sample=examples/specs/subscription/traces/runs/refundRefused.itf.json
          if [ -f "$sample" ]; then
            msg=$(python -c "import json,sys; print(json.dumps(json.load(open(sys.argv[1])), separators=(',', ':'))[:3800])" "$sample" | sed 's/%/%25/g')
            echo "::notice title=sample run trace::$msg"
          fi
          exit $status

      - name: spec-lint over the examples (Quint's typed IR, no FAIL allowed)
        if: steps.tpl.outputs.ok == 'true'
        env:
          QUINT_IR_ENGINE: cli
        run: '"$RUNNER_TEMP/annotate.sh" "spec-lint examples" python tools/spec-lint.py --root examples --no-color'

      - name: Tool tests with the Quint CLI present
        if: steps.tpl.outputs.ok == 'true'
        run: '"$RUNNER_TEMP/annotate.sh" "tool tests (quint present)" python -m pytest tests/ -q -rs'
