# Spec CI — runs on every PR touching specs/ or .spec/.
#
# Gates, in order of cost:
#   1. spec-lint            — jsonschema validation, structural consistency,
#                             EARS structure, witness obligations (trace
#                             present, valid ITF, fresh model_sha)
#   2. spec-matrix --strict — state×event completeness: every cell covered or
#                             explicitly triaged (GAP / IMPOSSIBLE / NO-OP /
#                             OUT-OF-SCOPE)
#   2b. spec-matrix --outcomes --strict — external×outcome completeness: every
#                             declared failure mode of every dependency is
#                             handled by a requirement or triaged
#   3. quint typecheck      — sidecars and probe modules still compile
#   4. quint test           — the model's `run` scenarios still pass, on the
#                             Rust evaluator (QUINT_EVAL_BACKEND to override;
#                             probed, so an older quint without --backend
#                             still runs the gate)
#
# QUINT_IR_ENGINE=cli pins lint/matrix to the Quint compiler's typed IR —
# verdicts here never depend on the lossy regex fallback. It is set on the
# spec-gates job only, since that is the job that installs the CLI: with the
# var set and the CLI absent, spec-lint FAILs quint/engine-unavailable and
# spec-matrix/spec-record refuse to run, rather than reporting clean over
# sidecars that all parsed as "no module".
#
# Deliberately NOT here, because both need the CODE repo checked out, which a
# spec repo's CI does not have in the multi-repo case:
#   tools/spec-extract-audit.py  (code -> spec coverage)
#   spec-record equiv            (differential vs the original implementation)
# Wire those into the CODE repo's CI instead, where the source actually is.
#
# Apalache model checking (/spec-check) and conformance replay (/spec-code-verify)
# are heavier and agent-driven; run them locally or scheduled. The optional
# Alloy backend is agent-driven for the same reason and needs no jar here:
# spec-lint's gate on proof: "structural" invariants is regex-only Python. ALSO wire each
# area's conformance.command into the CODE repo's own CI — the replay harness
# is an ordinary test file and needs no spec tooling.
#
# This file ships with the template; adjust paths/commands to your project.

name: spec-ci

on:
  pull_request:
    paths:
      - "specs/**"
      - ".spec/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "specs/**"
      - ".spec/**"
      - "schemas/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/**"

jobs:
  # The tooling's own unit + regression suite. Deliberately NOT gated on
  # .spec/project.json the way spec-gates below is: these test tools/, not a
  # project's specs, so this is the one job that must run in the template repo
  # itself — which is exactly where tools/ gets edited. Pure Python, no
  # quint/Apalache/Java, so it costs a checkout and a pip install.
  #
  # tests/ survives bootstrap on purpose: a project created from the template
  # ships these tools and keeps their tests. The few template-only assertions
  # skip themselves once the files they inspect are gone.
  tool-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: pip install pytest jsonschema

      - name: pytest (tools/ unit + regression suite)
        run: python -m pytest tests/ -q

  spec-gates:
    runs-on: ubuntu-latest
    # Scoped to this job, not the workflow: it pins lint/matrix to the Quint
    # compiler's typed IR, and only this job installs the Quint CLI. Set
    # workflow-wide it also reached tool-tests, where the CLI is absent, so
    # every sidecar silently parsed as "no module" and the checks that read
    # one quietly passed on nothing.
    env:
      QUINT_IR_ENGINE: cli
    steps:
      - uses: actions/checkout@v4

      # Template-repo guard: before bootstrap there is no .spec/project.json,
      # so every gate below would fail on its own repo's PRs. Skip cleanly.
      - name: Detect bootstrapped project
        id: boot
        run: |
          if [ -f .spec/project.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "No .spec/project.json — template repo, spec gates skipped."
          fi

      - uses: actions/setup-python@v5
        if: steps.boot.outputs.ok == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        if: steps.boot.outputs.ok == 'true'
        with:
          node-version: "20"

      - name: Install Quint CLI + jsonschema
        if: steps.boot.outputs.ok == 'true'
        run: |
          npm install -g @informalsystems/quint
          pip install jsonschema

      - name: spec-lint (jsonschema + consistency + EARS + witness obligations + freshness)
        if: steps.boot.outputs.ok == 'true'
        run: python tools/spec-lint.py --no-color

      - name: spec-matrix --strict (state×event completeness gate)
        if: steps.boot.outputs.ok == 'true'
        run: |
          set -e
          for area in $(python -c "import json; print(' '.join(a['name'] for a in json.load(open('.spec/project.json'))['areas'] if a.get('kind') != 'contract'))"); do
            echo "── matrix: $area"
            python tools/spec-matrix.py "$area" --stdout --strict > /dev/null
          done

      - name: spec-matrix --outcomes --strict (failure-behavior completeness gate)
        if: steps.boot.outputs.ok == 'true'
        run: |
          set -e
          for area in $(python -c "import json; print(' '.join(a['name'] for a in json.load(open('.spec/project.json'))['areas'] if a.get('kind') != 'contract'))"); do
            echo "── outcomes: $area"
            python tools/spec-matrix.py "$area" --outcomes --stdout --strict > /dev/null
          done

      - name: Quint typecheck (sidecars + probe modules)
        if: steps.boot.outputs.ok == 'true'
        run: |
          set -e
          for f in specs/*.qnt; do
            echo "── typecheck: $f"
            quint typecheck "$f"
          done

      - name: Quint test (run scenarios in the models)
        if: steps.boot.outputs.ok == 'true'
        run: |
          set -e
          shopt -s nullglob
          # The Rust evaluator is the fast one, but --backend landed after
          # the flag-less releases. Probe --help rather than pinning a
          # version: an older quint then runs exactly the command it ran
          # before, instead of failing the gate on an unknown flag.
          backend=""
          if quint test --help 2>&1 | grep -q -- "--backend"; then
            backend="--backend=${QUINT_EVAL_BACKEND:-rust}"
            echo "── evaluator: ${QUINT_EVAL_BACKEND:-rust}"
          fi
          for f in specs/*.qnt; do
            case "$f" in *.probes.qnt) continue;; esac
            echo "── test: $f"
            quint test $backend "$f" || exit 1
          done
